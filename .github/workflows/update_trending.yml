name: Auto-Update Trending Reels Feed

on:
  schedule:
    # Runs automatically every 3 hours (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger via GitHub Actions UI

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Trending Feed Generator
        run: python generate_youtube_trending.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube_trending.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-refresh 700 viral reels feed [skip ci]" && git push)
