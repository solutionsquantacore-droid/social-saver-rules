name: Auto-Update Trending Reels Feed

on:
  schedule:
    # Runs automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger via GitHub Actions UI

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yt-dlp

      - name: Run Trending Feed Generator
        run: python generate_trending.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trending_reels.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update trending reels [skip ci]" && git push)
